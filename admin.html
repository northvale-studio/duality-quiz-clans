<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Duality — Administration</title>
  <script src="./config.js"></script>
  <style>
    html,body{margin:0;min-height:100%;background:#0d0204;color:#f8ead9;font-family:Inter,system-ui,sans-serif}
    body{display:grid;place-items:center;min-height:100vh;padding:20px}
    .box{width:min(520px,100%);padding:30px;border:1px solid rgba(255,235,191,.15);border-radius:24px;background:linear-gradient(180deg,#26070d,#100306);box-shadow:0 30px 90px rgba(0,0,0,.42);text-align:center}
    .brand{font:600 4rem/.8 Georgia,'Times New Roman',serif;color:#fff0c8}
    p{color:#cdb8a6;line-height:1.7}
    .error{color:#ffd0d0}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">Duality</div>
    <p id="msg">Ouverture de l’espace administrateur…</p>
    <p class="error" id="error"></p>
  </div>
  <script>
    const url = window.DUALITY_CONFIG?.GOOGLE_SHEETS_WEBAPP_URL || '';
    const msg = document.getElementById('msg');
    const err = document.getElementById('error');
    if (!url || url.includes('PASTE_YOUR_')) {
      msg.textContent = '';
      err.textContent = 'L’espace administrateur n’est pas encore configuré.';
    } else {
      window.location.replace(url + (url.includes('?') ? '&' : '?') + 'view=admin');
    }
  </script>
</body>
</html>
